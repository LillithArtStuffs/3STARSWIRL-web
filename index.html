  /* ---- final room ---- */
  #finalRoom {
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:60;
  }
  #finalRoom.on { display:block; }

  #finalEgg {
    position:absolute;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    cursor:pointer;
    line-height:0;
    padding:24px;               /* easier to hit than the sprite alone */
  }

  /* two frames, flipped back and forth */
  /* 11x11 source, shown at 4x so every line stays exactly 4px wide */
  .sparkle {
    display:block;
    width:44px;
    height:44px;
    background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABYAAAALCAYAAAB7/H1+AAAASElEQVR42s1SQQoAMAjS/z/a3YeUDYJ1NJMUATOSNMFjXiXQiZf71+PWUWL55kQxTbN0fKYiAECSTtzhax//lfFKK1Z6PMn+ANE1f4pKuOihAAAAAElFTkSuQmCC);

    image-rendering:pixelated;

  }
  @keyframes twinkle {
    from { background-position: 0 0; }
    to   { background-position: -88px 0; }
  }

  /* ---- item asterisk + panel ---- */
  #inv { display:none; }
  #inv.on { display:block; }

  #invBtn {
    position:fixed;
    right:16px;
    bottom:14px;
    z-index:40;
    background:transparent;
    border:none;
    font-family:'UTDR', monospace;
    font-size:26px;
    line-height:1;
    padding:6px 10px;
    cursor:pointer;
    color:#000;                 /* dark text on the white 404 */
  }
  body.in-room #invBtn { color:#fff; }
  #invBtn:hover { color:#ff2f2f; }

  #invPanel {
    display:none;
    position:fixed;
    right:16px;
    bottom:56px;
    z-index:41;
    min-width:200px;
    background:#000;
    border:5px solid #fff;
    outline:2px solid #000;
    outline-offset:-9px;
    padding:16px 18px;
    font-family:'UTDR', monospace;
    color:#fff;
    font-size:17px;
    line-height:1.6;
  }
  #invPanel.on { display:block; }

  .inv-head {
    color:#8a8a8a;
    font-size:13px;
    letter-spacing:1px;
    margin-bottom:8px;
  }

  .inv-item { cursor:pointer; }
  .inv-item:hover { color:#ff2f2f; }

  #invDesc {
    margin-top:10px;
    color:#9a9a9a;
    font-size:14px;
    min-height:1.2em;
  }

  /* ---- egg room ---- */
  #room {
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
  }
  #room.on { display:block; }

  #treeWrap {
    position:absolute;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%);
    width:min(62vw, 420px);
    cursor:pointer;
  }

  #tree {
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;

    /* keep the blocks hard — no browser smoothing */
    image-rendering: pixelated;
    image-rendering: crisp-edges;

    /* pivot at the trunk base so the canopy travels and the roots don't */
    transform-origin: 50% 100%;
    animation: sway 7.5s ease-in-out infinite;
  }

  @keyframes sway {
    0%   { transform: rotate(-0.75deg); }
    50%  { transform: rotate(0.75deg); }
    100% { transform: rotate(-0.75deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    #tree { animation: none; }
  }

  #flick {
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  #flick.on { opacity:1; }

  #mute {
    position:absolute;
    right:14px;
    top:12px;
    background:transparent;
    border:none;
    color:#4a4a4a;
    font-size:20px;
    line-height:1;
    padding:6px 8px;
    cursor:pointer;
    font-family:'UTDR', monospace;
  }
  #mute:hover { color:#fff; }
  #mute.off { color:#2a2a2a; text-decoration:line-through; }
  #mute.waiting { color:#8a7a2a; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  #astatus {
    position:absolute;
    right:12px;
    top:44px;
    color:#8a2a2a;
    font-family:'UTDR', monospace;
    font-size:12px;
    text-align:right;
    max-width:70vw;
    pointer-events:none;
  }

  #credit {
    position:absolute;
    left:10px;
    bottom:8px;
    color:#242424;
    font-family:'UTDR', monospace;
    font-size:11px;
    letter-spacing:0.5px;
    pointer-events:none;
    max-width:60vw;
  }

  #hint {
    position:absolute;
    left:0; right:0;
    bottom:190px;
    text-align:center;
    color:#3a3a3a;
    font-family:'UTDR', monospace;
    font-size:15px;
    letter-spacing:1px;
    pointer-events:none;
  }

  /* ---- dialogue box ---- */
  #box {
    display:none;
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    width:min(640px, calc(100vw - 20px));
    min-height:150px;
    background:#000;
    /* thick outer rule, thin inner gap, like the dark-world boxes */
    border:6px solid #fff;
    outline:3px solid #000;
    outline-offset:-11px;
    padding:24px 26px 22px;
    box-sizing:border-box;
    color:#fff;
    font-family:'UTDR', monospace;
    font-size:21px;
    line-height:1.5;
    cursor:pointer;
    flex-direction:column;
  }
  #box.on { display:flex; }

  /* the line sits up top; choices get pushed to the bottom */
  #textrow {
    white-space:nowrap;
    overflow:hidden;
  }

  /* four-point sparkles sitting on the corners */
  .corner {
    position:absolute;
    width:14px;
    height:14px;
    pointer-events:none;
  }
  .corner::before, .corner::after {
    content:'';
    position:absolute;
    background:#fff;
  }
  .corner::before { left:6px; top:0;  width:2px; height:14px; }
  .corner::after  { left:0;  top:6px; width:14px; height:2px; }
  .corner.tl { left:-8px;  top:-8px; }
  .corner.tr { right:-8px; top:-8px; }
  .corner.bl { left:-8px;  bottom:-8px; }
  .corner.br { right:-8px; bottom:-8px; }

  #choices { display:none; }
  #choices.on {
    display:flex;
    justify-content:space-between;   /* one at each end */
    width:100%;
    padding:0 18px 0 44px;           /* left room for the soul beside "Yes" */
    box-sizing:border-box;
    margin-top:auto;                 /* pin to the bottom of the box */
    position:relative;
  }

  .opt {
    font-family:'UTDR', monospace;
    font-size:21px;
    color:#fff;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }

  /* one soul, slid into place — not one per option */
  #soul {
    position:absolute;
    left:0;
    top:50%;
    width:22px;
    height:20px;
    line-height:0;
    pointer-events:none;
    /* translate3d keeps it on whole pixels — no subpixel smearing */
    transform:translate3d(0,-50%,0);
    transition:transform 110ms cubic-bezier(.2,.9,.3,1);
  }
  #soul svg { display:block; }

  #cursor.blink { animation: bl 1s steps(1) infinite; }
  @keyframes bl { 0%,49%{opacity:1} 50%,100%{opacity:0} }
</style>
</head>

<script>
(function(){

  // ---------------------------------------------------------------
  // odds. 1 in ODDS per roll. rolls on page load, and again every
  // time you click the "404". higher = rarer.
  // ---------------------------------------------------------------
  const ODDS = 25;

  const normal   = document.getElementById('normal');
  const room     = document.getElementById('room');
  const treeWrap = document.getElementById('treeWrap');
  const box      = document.getElementById('box');
  const lineEl   = document.getElementById('line');
  const cursor   = document.getElementById('cursor');
  const choices  = document.getElementById('choices');
  const hint     = document.getElementById('hint');
  const flick    = document.getElementById('flick');

  function roll(){ return Math.floor(Math.random() * ODDS) === 0; }
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // ---------------------------------------------------------------
  // egg flag — SESSION only. survives reloads in this tab, but is
  // gone once the tab/browser closes. stored two ways so anything
  // built later can check for it:
  //   sessionStorage.getItem('swirl_egg') === '1'
  //   document.cookie contains swirl_egg=1   (session cookie, no max-age)
  // ---------------------------------------------------------------
  function hasEgg(){
    if (sessionStorage.getItem('swirl_egg') === '1') return true;
    return document.cookie.split(';').some(c => c.trim().startsWith('swirl_egg=1'));
  }

  // ---------------------------------------------------------------
  // items. kept as a list so more can be added later without
  // reworking any of this. session-scoped, same as the egg flag.
  // ---------------------------------------------------------------
  const ITEM_DESC = {
    'Egg': '* (It does nothing.)'
  };

  function getItems(){
    try { return JSON.parse(sessionStorage.getItem('swirl_items') || '[]'); }
    catch(e){ return []; }
  }

  function addItem(name){
    const items = getItems();
    items.push(name);                  // duplicates allowed — four eggs is the joke
    try { sessionStorage.setItem('swirl_items', JSON.stringify(items)); } catch(e){}
    refreshInv();
  }

  function eggCount(){
    return getItems().filter(n => n === 'Egg').length;
  }

  function finalDone(){
    return sessionStorage.getItem('swirl_405') === '1';
  }

  // counts rapid repeated clicks; resets if you pause
  function spamCounter(need, gapMs){
    let n = 0, last = 0;
    return function(){
      const now = Date.now();
      if (now - last > gapMs) n = 0;
      last = now;
      n++;
      if (n >= need){ n = 0; return true; }
      return false;
    };
  }

  const invWrap  = document.getElementById('inv');
  const invBtn   = document.getElementById('invBtn');
  const invPanel = document.getElementById('invPanel');
  const invList  = document.getElementById('invList');
  const invDesc  = document.getElementById('invDesc');

  const doorWrap = document.getElementById('doorWrap');

  function refreshInv(){
    const items = getItems();
    const done = eggCount() >= 4;
    // the door only belongs on the main page — if it's shown while
    // you're still standing in the egg room it floats over the tree
    const showDoor = done && !inRoom && !finalDone();
    // at four eggs the asterisk is gone and a door is there instead
    invWrap.classList.toggle('on', items.length > 0 && !done);
    doorWrap.classList.toggle('on', showDoor);
    document.body.classList.toggle('door-time', showDoor);
    if (done) invPanel.classList.remove('on');
    invList.innerHTML = '';
    items.forEach(name => {
      const row = document.createElement('div');
      row.className = 'inv-item';
      row.textContent = '* ' + name;
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        invDesc.textContent = ITEM_DESC[name] || '';
        playSfx('text');
      });
      invList.appendChild(row);
    });
    if (!items.length) invPanel.classList.remove('on');
  }

  invBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = invPanel.classList.toggle('on');
    if (!open) invDesc.textContent = '';
    playSfx('text');
  });

  // click anywhere else closes it
  document.addEventListener('click', (e) => {
    if (!invPanel.classList.contains('on')) return;
    if (invPanel.contains(e.target) || e.target === invBtn) return;
    invPanel.classList.remove('on');
    invDesc.textContent = '';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      invPanel.classList.remove('on');
      invDesc.textContent = '';
    }
  });

  function giveEgg(){
    sessionStorage.setItem('swirl_egg', '1');
    sessionStorage.setItem('swirl_egg_at', new Date().toISOString());
    addItem('Egg');
    // session cookie (no max-age) — but a session cookie only dies with
    // the whole browser, not this tab, so we also clear it explicitly
    // on unload below.
    document.cookie = 'swirl_egg=1; path=/; SameSite=Lax';
  }

  function clearEgg(){
    try {
      sessionStorage.removeItem('swirl_egg');
      sessionStorage.removeItem('swirl_egg_at');
      sessionStorage.removeItem('swirl_items');
    } catch(e){}
    document.cookie = 'swirl_egg=; path=/; max-age=0; SameSite=Lax';
  }

  // the egg is meant to last exactly one visit — bin it when the tab goes
  window.addEventListener('pagehide', clearEgg);
  window.addEventListener('beforeunload', clearEgg);

  // ---------------------------------------------------------------
  // music. preload="none" means the file is only ever fetched if
  // someone actually lands in the room.
  //
  // browsers won't let audio start without a user gesture. entering
  // by clicking the 404 counts as one; entering on page load does
  // not — so if the first play() is refused we just wait for the
  // next click anywhere and start then.
  // ---------------------------------------------------------------
  const music   = document.getElementById('music');
  const muteBtn = document.getElementById('mute');
  const statusEl = document.getElementById('astatus');
  let muted = false;
  let fadeTimer = null;
  let inRoom = false;   // hard gate: music may only ever run inside the room

  function showStatus(msg){
    statusEl.textContent = msg;
    if (msg) console.log('[egg audio]', msg);
  }

  // Pick the format up front, synchronously, and point src straight at
  // it. preload="none" means nothing is actually fetched until play().
  //
  // This has to stay synchronous: browsers only allow play() while a
  // user gesture is still "live", and any await in between throws that
  // away — which is exactly why entering via a click still refused to
  // start the music before.
  music.src = (music.canPlayType('audio/mpeg') !== '') ? 'egg.mp3' : 'egg.ogg';

  music.addEventListener('error', () => {
    const e = music.error;
    const codes = {1:'aborted', 2:'network', 3:'decode failed', 4:'not found / unsupported'};
    showStatus('audio: ' + ((e && codes[e.code]) || 'unknown') + ' (' + music.getAttribute('src') + ')');
    muteBtn.textContent = '!';
    muteBtn.style.color = '#8a2a2a';
  });

  music.addEventListener('playing', () => {
    showStatus('');
    muteBtn.classList.remove('waiting');
    muteBtn.textContent = '\u266A';
    muteBtn.style.color = '';
  });

  function startMusic(){
    if (muted || !inRoom) return;
    music.volume = 0.5;
    const p = music.play();
    if (p && p.catch){
      p.catch(() => {
        // no gesture available yet (room appeared on page load) —
        // arm the next tap anywhere. this listener can outlive the
        // room, so it has to re-check inRoom before doing anything,
        // or it will happily start the music on the 404 page.
        muteBtn.classList.add('waiting');
        const go = () => {
          if (muted || !inRoom) return;
          music.play().catch(() => {});
        };
        document.addEventListener('click', go, { once: true });
        document.addEventListener('touchend', go, { once: true });
      });
    }
  }

  function stopMusic(){
    clearInterval(fadeTimer);
    music.pause();
    try { music.currentTime = 0; } catch(e){}
    muteBtn.classList.remove('waiting');
  }

  function fadeOutMusic(ms){
    clearInterval(fadeTimer);
    if (music.paused){ stopMusic(); return; }
    const steps = 16;
    const step = (music.volume || 0.5) / steps;
    let n = 0;
    fadeTimer = setInterval(() => {
      n++;
      music.volume = Math.max(0, music.volume - step);
      if (music.volume <= 0.001 || n >= steps){ stopMusic(); }
    }, ms / steps);
    // hard backstop — whatever happens above, it is silent by then
    setTimeout(stopMusic, ms + 120);
  }

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.classList.toggle('off', muted);
    if (muted){ stopMusic(); }
    else if (inRoom){ music.volume = 0.5; startMusic(); }
  });

  // belt and braces: if the room is ever hidden, the music goes with it
  window.addEventListener('pagehide', stopMusic);

  // ---------------------------------------------------------------
  // sfx — plain <audio> elements, not Web Audio.
  //
  // Web Audio gets muted by the iOS hardware ringer switch in ways
  // that <audio> playback does not, which is why the music was
  // audible but these were silent. The catch is that one <audio>
  // element can't retrigger fast enough for a blip firing every
  // ~38ms, so each sound gets a small pool of elements that we
  // cycle through — one voice per character, overlapping cleanly.
  // ---------------------------------------------------------------
  const canMp3 = (new Audio()).canPlayType('audio/mpeg') !== '';

  const SFX_SRC = {
    text: canMp3 ? 'sfx-text.wav' : 'sfx-text.ogg',   // wav = no encoder padding
    egg:  canMp3 ? 'sfx-egg.mp3'  : 'sfx-egg.ogg',
    door: canMp3 ? 'sfx-door.mp3' : 'sfx-door.ogg'
  };

  const sfxPools = {};
  let sfxFailed = false;

  function buildPool(name, size, vol){
    const pool = [];
    for (let i = 0; i < size; i++){
      const a = new Audio(SFX_SRC[name]);
      a.preload = 'auto';
      a.volume = vol;
      a.addEventListener('error', () => {
        if (!sfxFailed){
          sfxFailed = true;
          showStatus('sfx missing: ' + SFX_SRC[name]);
        }
      });
      pool.push(a);
    }
    sfxPools[name] = { pool, i: 0 };
  }

  function loadSfx(){
    if (sfxPools.text) return;
    buildPool('text', 6, 0.55);   // fires per character, needs headroom
    buildPool('egg',  1, 0.9);
    buildPool('door', 1, 0.85);
  }

  function playSfx(name){
    const p = sfxPools[name];
    if (!p) return;
    const a = p.pool[p.i];
    p.i = (p.i + 1) % p.pool.length;
    try {
      a.currentTime = 0;
      const r = a.play();
      if (r && r.catch) r.catch(() => {});
    } catch(e){}
  }

  // ---------------------------------------------------------------
  // dialogue
  // ---------------------------------------------------------------
  let typing = false;

  // scale the line down if it would overflow, so a long line never
  // breaks onto a second row on a narrow screen
  const BASE_FONT = 21;
  function fitLine(text){
    lineEl.style.fontSize = '';
    const avail = box.clientWidth - 52;          // minus horizontal padding
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;' +
                          "font-family:'UTDR',monospace;font-size:" + BASE_FONT + 'px;';
    probe.textContent = text + ' ';
    document.body.appendChild(probe);
    const w = probe.offsetWidth;
    document.body.removeChild(probe);
    if (w > avail && w > 0){
      lineEl.style.fontSize = Math.max(11, Math.floor(BASE_FONT * avail / w)) + 'px';
    }
  }

  function type(text){
    return new Promise(resolve => {
      typing = true;
      fitLine(text);
      lineEl.textContent = '';
      cursor.classList.remove('blink');
      let i = 0;
      (function step(){
        if (!typing){
          lineEl.textContent = text;
          cursor.classList.add('blink');
          resolve();
          return;
        }
        if (i < text.length){
          lineEl.textContent += text[i];
          if (text[i] !== ' ') playSfx('text');
          i++;
          setTimeout(step, 24);
        } else {
          typing = false;
          cursor.classList.add('blink');
          resolve();
        }
      })();
    });
  }

  function waitClick(){
    return new Promise(resolve => {
      function onClick(){
        if (typing){ typing = false; return; }  // first click finishes the line
        box.removeEventListener('click', onClick);
        resolve();
      }
      box.addEventListener('click', onClick);
    });
  }

  // soul-cursor choice: arrows/tap to move, enter or z to confirm.
  // tapping an option directly picks it outright.
  function waitChoice(){
    return new Promise(resolve => {
      const opts = Array.from(choices.querySelectorAll('.opt'));
      let sel = -1;                    // -1 = undecided, soul waits in the middle
      choices.classList.add('on');

      const soul = document.getElementById('soul');

      const SOUL_W = 22;
      function place(){
        // round to whole pixels, otherwise the sprite lands on a
        // half-pixel and the browser smears it
        let x;
        if (sel < 0){
          x = Math.round((choices.clientWidth - SOUL_W) / 2);   // dead centre
        } else {
          x = Math.round(opts[sel].offsetLeft - SOUL_W - 10);   // just left of the word
        }
        soul.style.transform = 'translate3d(' + x + 'px, -50%, 0)';
      }

      function draw(){
        opts.forEach((o, i) => o.classList.toggle('sel', i === sel));
        place();
      }

      function move(d){
        // first nudge commits to whichever side you pushed toward
        sel = (sel < 0) ? (d < 0 ? 0 : opts.length - 1)
                        : (sel + d + opts.length) % opts.length;
        playSfx('text');
        draw();
      }
      function finish(v){
        choices.classList.remove('on');
        document.removeEventListener('keydown', onKey);
        opts.forEach((o, i) => o.removeEventListener('click', clickers[i]));
        resolve(v === '1');
      }
      function onKey(e){
        const k = e.key.toLowerCase();
        if (k === 'arrowleft'  || k === 'a') { e.preventDefault(); move(-1); }
        else if (k === 'arrowright' || k === 'd') { e.preventDefault(); move(1); }
        else if (k === 'enter' || k === ' ' || k === 'z') {
          e.preventDefault();
          if (sel < 0) return;         // nothing picked yet
          finish(opts[sel].dataset.v);
        }
      }
      const clickers = opts.map((o, i) => {
        const fn = (e) => { e.stopPropagation(); sel = i; draw(); finish(o.dataset.v); };
        o.addEventListener('click', fn);
        return fn;
      });

      draw();
      document.addEventListener('keydown', onKey);
    });
  }

  async function flicker(){
    for (let i = 0; i < 2; i++){
      flick.classList.add('on');
      await sleep(30);
      flick.classList.remove('on');
      await sleep(60);
    }
  }

  // ---------------------------------------------------------------
  // the encounter
  // ---------------------------------------------------------------
  let busy = false;
  let roomGrants = false;      // does the tree hand over an egg in this room?
  const SPAM_NEED = 12;
  const treeSpam = spamCounter(SPAM_NEED, 700);

  function exitRoom(){
    inRoom = false;          // set first, so nothing can restart it
    document.body.classList.remove('in-room');
    stopMusic();
    room.classList.remove('on');
    box.classList.remove('on');
    hint.textContent = '';
    normal.style.display = '';
    refreshInv();            // door only appears now you're back out here
  }

  // offered at the end of any exchange, so you're never stuck here
  async function offerExit(){
    await type('* (Leave?)');
    const go = await waitChoice();
    if (go){
      inRoom = false;
      stopMusic();
      box.classList.remove('on');
      await flicker();
      exitRoom();
    } else {
      box.classList.remove('on');
    }
  }

  async function grantEgg(){
    await type('* (He offers you an Egg.)');
    await waitClick();

    await type('* (Take it?)');
    const yes = await waitChoice();

    if (!yes){
      await type('* (He does not seem surprised.)');
      await waitClick();
      await offerExit();
      return;
    }

    giveEgg();
    playSfx('egg');
    await flicker();

    await type('* (You got the Egg.)');
    await waitClick();

    await type('* (It does nothing.)');
    await waitClick();

    await offerExit();
  }

  // brief refusal that clears itself — no click needed to dismiss
  const DENY_LINE = "* (Well, there isn't a man here.)";
  let denyTimer = null;
  function showDenial(){
    clearTimeout(denyTimer);
    typing = false;
    choices.classList.remove('on');
    box.classList.add('on');
    fitLine(DENY_LINE);
    lineEl.textContent = DENY_LINE;
    cursor.classList.remove('blink');
    playSfx('text');
    denyTimer = setTimeout(() => {
      if (!busy) box.classList.remove('on');
    }, 950);
  }

  async function talkToTree(){
    if (busy) return;

    const n = eggCount();

    // fourth egg: the tree only gives it up if you really insist.
    // the refusal flashes up and clears itself instead of waiting on a
    // click, so you can just mash the tree rather than sitting through
    // the same line a dozen times.
    if (!roomGrants && n === 3){
      if (busy) return;              // the crack sequence is already running
      hint.textContent = '';

      if (treeSpam()){
        clearTimeout(denyTimer);
        busy = true;
        box.classList.add('on');
        await type('* (...)');
        await waitClick();
        await type('* (Something is still here after all.)');
        await waitClick();
        await grantEgg();
        busy = false;
        return;
      }

      showDenial();
      return;
    }

    busy = true;
    hint.textContent = '';
    box.classList.add('on');

    if (roomGrants){
      roomGrants = false;                    // one egg per visit
      await type('* (Well, there is a man here.)');
      await waitClick();
      await grantEgg();
    } else {
      await type("* (Well, there isn't a man here.)");
      await waitClick();
      await offerExit();
    }

    busy = false;
  }

  function enterRoom(grants){
    roomGrants = !!grants;
    inRoom = true;
    refreshInv();          // tuck the door/asterisk away while in here
    document.body.classList.add('in-room');
    loadSfx();
    normal.style.display = 'none';
    room.classList.add('on');
    treeWrap.addEventListener('click', talkToTree);
    startMusic();

    // if they just stand there, nudge once
    setTimeout(() => {
      if (!busy && !box.classList.contains('on')) hint.textContent = '(the tree)';
    }, 4500);
  }

  refreshInv();

  // the 404 becomes a 405 once the chain is finished
  if (sessionStorage.getItem('swirl_405') === '1'){
    document.getElementById('fourohfour').textContent = '405';
  }

  if (roll()) enterRoom(eggCount() === 0);

  document.getElementById('fourohfour').addEventListener('click', () => {
    if (roll()) enterRoom(eggCount() === 0);
  });

  // ---------------------------------------------------------------
  // the chain
  //   1. the tree, in a room you stumbled into
  //   2. spam the item asterisk
  //   3. spam the contact address
  //   4. back to the tree, and insist
  // ---------------------------------------------------------------
  const invSpam = spamCounter(SPAM_NEED, 700);
  invBtn.addEventListener('click', () => {
    if (eggCount() !== 1) return;
    if (invSpam()){
      invPanel.classList.remove('on');
      enterRoom(true);
    }
  });

  const mailSpam = spamCounter(SPAM_NEED, 700);
  document.getElementById('mail').addEventListener('click', () => {
    if (eggCount() !== 2) return;
    if (mailSpam()) enterRoom(true);
  });

  // ---------------------------------------------------------------
  // the door
  // ---------------------------------------------------------------
  const finalRoom = document.getElementById('finalRoom');
  const finalEgg  = document.getElementById('finalEgg');
  let finalBusy = false;

  let doorOpening = false;
  document.getElementById('doorBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (eggCount() < 4 || doorOpening) return;
    doorOpening = true;

    loadSfx();
    stopMusic();
    playSfx('door');            // sound first, then it opens
    await sleep(900);

    inRoom = false;
    room.classList.remove('on');
    normal.style.display = 'none';
    document.body.classList.add('in-room');
    doorWrap.classList.remove('on');
    finalRoom.classList.add('on');
    finalRoom.appendChild(box);
    doorOpening = false;
  });

  finalEgg.addEventListener('click', async () => {
    if (finalBusy) return;
    finalBusy = true;

    box.classList.add('on');
    await type("* (There isn't a man anymore.)");
    await waitClick();
    await type('* (Just an egg.)');
    await waitClick();
    await type('* (Take it?)');
    const yes = await waitChoice();

    if (!yes){
      await type('* (It waits.)');
      await waitClick();
      box.classList.remove('on');
      finalBusy = false;
      return;
    }

    playSfx('egg');
    box.classList.remove('on');
    await flicker();
    await sleep(140);
    await flicker();

    try { sessionStorage.setItem('swirl_405', '1'); } catch(e){}
    document.getElementById('fourohfour').textContent = '405';

    finalRoom.classList.remove('on');
    document.body.classList.remove('in-room');
    document.body.classList.remove('door-time');
    normal.style.display = '';
    refreshInv();
    finalBusy = false;
  });

})();
</script>
