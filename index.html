<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3STARSWIRL</title>

  <meta property="og:title" content="3STARSWIRL">
  <meta property="og:description" content="it's over.">
  <meta property="og:type" content="website">

  <meta name="description" content="it's over.">
  <meta name="theme-color" content="#ffffff">
</head>

<body style="background:white;color:black;font-family:sans-serif;">
  <div id="text"></div>

  <script>
    const text = document.getElementById("text");

    const messages = [
      { text: "it's over", delay: 0 },
      { text: "go home", delay: 1500 },
      { text: "3starswirl isn't anything anymore", delay: 3000 },

      { text: "good job", delay: 9000 },
      { text: "this is your fault", delay: 12000 }
    ];

    messages.forEach(msg => {
      setTimeout(() => {
        text.innerHTML += `<p>${msg.text}</p>`;
      }, msg.delay);
    });

    setTimeout(() => {
      window.close();

      setTimeout(() => {
        if (!window.closed) {
          location.replace("about:blank");
        }
      }, 500);
    }, 15000);
  </script>
</body>
</html>
